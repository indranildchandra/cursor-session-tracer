[tool.pytest.ini_options]
# Only the maintained suite under tests/ is collected. The reference solution
# under "files-changed post-demo-run/" imports demo.resilience, which does not
# exist in the naive demo/ by design (the canary asserts its absence), so it must
# not be collected as part of the suite.
testpaths = ["tests"]
norecursedirs = ["files-changed*", ".venv", ".git", "*.egg-info"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["files-changed post-demo-run", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter
